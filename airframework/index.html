/* ---------- construção dos slides ---------- */
function critRow(id, scored){
  const d = D[id];
  const dots = [0,1,2].map(i=>`<i class="${scored && i===d.s ? 's'+d.s : ''}"></i>`).join('');
  const cls = scored ? 'crit click' : 'crit';
  const attrs = scored ? ` tabindex="0" role="button" data-id="${id}" aria-haspopup="dialog"` : '';
  return `<div class="${cls}"${attrs}><span class="id">${id}</span><span class="txt">${d.label}</span><span class="dots">${dots}</span></div>`;
}
function pillarsHTML(scored){
  return PILLARS.map(p=>{
    const secs = p.secs.map(s=>`
      <div class="sec-t">${s.t}</div><div class="sec-q">${s.q}</div>
      ${s.subs.map(sub=>`${sub.t?`<div class="sub-t">${sub.t}</div>`:''}${sub.ids.map(id=>critRow(id,scored)).join('')}`).join('')}`).join('');
    return `<div class="abs pillar ${p.k}">
      <div class="kicker">${p.kicker}</div>
      <h2>${p.name}${scored?`<span class="pscore">${p.score}</span>`:''}</h2>
      ${secs}</div>`;
  }).join('');
}

/* ---------- escala ---------- */
function fit(){
  const f = Math.min(1,(document.documentElement.clientWidth-24)/1280);
  document.querySelectorAll('.stage-wrap').forEach(w=>{
    w.style.width=(1280*f)+'px'; w.style.height=(720*f)+'px';
    w.querySelector('.stage').style.transform=`scale(${f})`;
  });
}
addEventListener('resize',fit); fit();

/* ---------- tabs ---------- */
const tabs=[...document.querySelectorAll('.tab')];
function showWindow(w){
  tabs.forEach(t=>t.setAttribute('aria-selected', String(t.dataset.w===w)));
  document.querySelectorAll('.window').forEach(s=>s.classList.toggle('on', s.id===w));
  window.scrollTo({top:0});
}
tabs.forEach(t=>t.addEventListener('click',()=>{closePanel();showWindow(t.dataset.w);}));

/* ---------- painel de evidência ---------- */
const panel=document.getElementById('panel'), veil=document.getElementById('veil');
function srcChip(s){
  if(/[\s()]/.test(s)) return `<span>${s}</span>`;
  return `<a href="https://${s}" target="_blank" rel="noopener">${s}</a>`;
}
function openPanel(id){
  const d=D[id]; const pk=id[0].toLowerCase();
  panel.innerHTML=`
    <div class="panel-head">
      <span class="id ${pk}">${id}</span>
      <h3 id="panel-title">${d.label}</h3>
      <button class="x" aria-label="Fechar">✕</button>
    </div>
    <div class="panel-body">
      <span class="spill s${d.s}"><i></i>${SCORE_NAMES[d.s]}</span>
      <div class="pb-sec"><h4>Racional</h4><p>${d.rac}</p></div>
      <div class="pb-sec"><h4>Fontes consultadas</h4><div class="srcs">${d.src.map(srcChip).join('')}</div></div>
      <div class="pb-sec"><h4>Citações-chave (extratos exatos)</h4><div class="quote">${d.cit}</div></div>
    </div>
    <div class="panel-foot">
      <a class="prova" href="${EXPLORER}#${id}" target="_blank" rel="noopener">Ver prova no Evidence Explorer ↗</a>
      <span class="hint2">screenshots e texto integral das fontes</span>
    </div>`;
  panel.querySelector('.x').addEventListener('click', closePanel);
  veil.classList.add('on'); panel.classList.add('on');
  panel.scrollTop=0; panel.querySelector('.x').focus({preventScroll:true});
}
function closePanel(){ veil.classList.remove('on'); panel.classList.remove('on'); }
veil.addEventListener('click', closePanel);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });
document.getElementById('slide3').addEventListener('click', e=>{
  const row=e.target.closest('.crit.click'); if(row) openPanel(row.dataset.id);
});
document.getElementById('slide3').addEventListener('keydown', e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const row=e.target.closest('.crit.click'); if(row){ e.preventDefault(); openPanel(row.dataset.id); }
});

if(/^[VLC](10|[1-9])$/.test(h) && D[h]){ showWindow('w3'); openPanel(h); }
